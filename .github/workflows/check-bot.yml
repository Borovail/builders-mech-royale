name: Check bot on Linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # compare regeneration against the published E07

      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64

      - name: Download and verify official kit
        run: |
          CHECK_KIT_DIR="$(mktemp -d)"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            https://www.joinbuilders.org/buildathon/tracks/builders/files/mechfight-kit.tar.gz \
            --output "$CHECK_KIT_DIR/mechfight-kit.tar.gz"
          printf '1758fe9125e193b268c6c1cffbf2c0ae96377214ab06d117412571c1523065ba  %s\n' \
            "$CHECK_KIT_DIR/mechfight-kit.tar.gz" | sha256sum --check -
          tar -xzf "$CHECK_KIT_DIR/mechfight-kit.tar.gz" -C "$CHECK_KIT_DIR"
          echo "KIT_DIR=$CHECK_KIT_DIR/mechfight-kit" >> "$GITHUB_ENV"

      - name: Check E01 routes
        run: python3 tests/check_routes.py --kit "$KIT_DIR"

      - name: Check E05 ground boost and energy
        run: python3 tests/check_mobility.py --kit "$KIT_DIR"

      - name: Check E06 resource collection
        run: python3 tests/check_economy.py --kit "$KIT_DIR"

      - name: Check secondary slot controls
        run: python3 -m unittest discover -s tests -p test_secondary.py

      - name: Compare in-zone regeneration against E07
        run: |
          previous="$(mktemp -d)"
          git archive 6ba4e8105a9de2a6f438da7761da22b4ab04ee44 | tar -xf - -C "$previous"
          python3 tests/check_recovery.py --kit "$KIT_DIR" --baseline "$previous/example_bot.py"

      - name: Check local referee supply clock
        run: python3 -m unittest discover -s tests -p test_supply_arena.py

      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 -t mech-royale-check .

      - name: Check container protocol three times
        run: |
          for attempt in 1 2 3; do
            echo "Container conformance pass $attempt/3"
            python3 "$KIT_DIR/check/check.py" --map-dir /arena -- \
              docker run --platform linux/amd64 --rm -i --network none --cpus 1 \
              --memory 512m --read-only --tmpfs /tmp:rw,size=64m --user 65534:65534 \
              -v "$KIT_DIR/arena:/arena:ro" mech-royale-check
          done
